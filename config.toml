# Default M1 config (spec section "Default config"). Values are frozen by the spec.
power_mw = 100.0
energy_mwh = 200.0
charge_eff = 0.927        # sqrt(0.86) each way, 86% round trip
discharge_eff = 0.927
initial_soc_mwh = 0.0
locations = ["HB_NORTH", "HB_HOUSTON", "HB_WEST"]
start = 2023-01-01
end = 2024-12-31

[rolling]
lookahead_days = 1
forecast = "persistence"

[sweep]
durations_h = [1, 2, 4]                        # energy_mwh = power_mw * duration_h
round_trip_efficiencies = [0.80, 0.86, 0.92]   # split sqrt() per side

[ancillary]
enabled = false            # backtest co-opt off unless --ancillary or this flag
products = ["REG_UP", "REG_DOWN", "RRS", "ECRS", "NONSPIN"]

[ancillary.sustain_hours]  # defaults for DEFAULT_AS_PRODUCTS
REG_UP = 1.0
REG_DOWN = 1.0
RRS = 1.0
ECRS = 2.0
NONSPIN = 4.0
