[project]
name = "bess-optimizer"
version = "0.1.0"
description = "Perfect-foresight battery energy arbitrage on ERCOT day-ahead prices: LP dispatch optimizer, backtester, and plots"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Travis Martin" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "highspy>=1.7",
    "gridstatus==0.36.0",
    "typer>=0.12",
    "matplotlib>=3.9",
]

[project.scripts]
bess = "bess.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pandas-stubs>=2.2",
    "maturin>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bess"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The spec and handoff docs are frozen inputs; ruff must never rewrite them.
extend-exclude = ["specs", "ai_docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["gridstatus.*", "highspy.*", "bess_engine"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not manual'"
markers = [
    "manual: touches the network (gridstatus); excluded from the default run and CI.",
]
